<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Block Mosaic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ── Tokens ─────────────────────────────────────────────────── */
      :root {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 12px;

        --bg:       #1e1e1e;
        --surface:  #282828;
        --surface2: #313131;
        --border:   #3a3a3a;
        --text:     #e5e5e5;
        --text2:    #999999;
        --text3:    #666666;
        --accent:   #0d99ff;
        --error:    #f87171;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
      }

      body {
        width: 340px;
        max-width: 100%;
        overflow: hidden;
      }

      button, input { font: inherit; color: inherit; }

      /* ── App shell ──────────────────────────────────────────────── */
      .app {
        width: 340px;
        max-width: 100%;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }

      /* ── Titlebar ───────────────────────────────────────────────── */
      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 10px 10px 14px;
        border-bottom: 1px solid var(--border);
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: grid;
        place-items: center;
        color: var(--text2);
      }

      .brand-mark svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
      }

      .title-group { flex: 1; min-width: 0; }

      h1 {
        font-size: 13px;
        line-height: 18px;
        font-weight: 600;
        color: var(--text);
      }

      .titlebar-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      /* ── Icon buttons ───────────────────────────────────────────── */
      .icon-button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        color: var(--text2);
        transition: background 0.12s, color 0.12s;
      }

      .icon-button:hover {
        background: var(--surface);
        color: var(--text);
      }

      .icon-button:active { opacity: 0.7; }

      .icon-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .icon-button svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Sections ───────────────────────────────────────────────── */
      main { display: flex; flex-direction: column; }

      .section {
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--border);
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 10px;
      }

      .section-title {
        font-size: 11px;
        line-height: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text3);
      }

      /* ── Parameter rows ─────────────────────────────────────────── */
      .parameter-row {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: center;
        min-height: 32px;
        margin-bottom: 6px;
      }

      .parameter-row:last-child { margin-bottom: 0; }

      .row-label {
        padding-right: 8px;
        color: var(--text2);
        font-size: 12px;
        line-height: 18px;
        font-weight: 400;
        white-space: nowrap;
      }

      /* ── Compound field (slider + number) ───────────────────────── */
      .compound-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 52px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        transition: border-color 0.12s;
      }

      .compound-field:focus-within {
        border-color: var(--accent);
      }

      .range-wrap {
        display: flex;
        align-items: center;
        padding: 0 10px;
        min-width: 0;
      }

      /* Flat custom range */
      input[type="range"] {
        width: 100%;
        min-width: 0;
        height: 14px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 1px;
        background: linear-gradient(
          to right,
          var(--accent) 0%,
          var(--accent) calc(var(--pct, 0) * 1%),
          var(--border) calc(var(--pct, 0) * 1%),
          var(--border) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: 0;
        margin-top: -5px;
        transition: transform 0.1s;
      }

      input[type="range"]:hover::-webkit-slider-thumb {
        transform: scale(1.2);
      }

      input[type="number"],
      input[type="text"] {
        min-width: 0;
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 0;
        border-left: 1px solid var(--border);
        border-radius: 0;
        outline: 0;
        background: var(--surface2);
        color: var(--text);
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        appearance: none;
        margin: 0;
      }

      /* ── Color rows ─────────────────────────────────────────────── */
      .color-row {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: center;
        min-height: 32px;
        margin-bottom: 6px;
      }

      .color-row:last-child { margin-bottom: 0; }

      .color-row .row-label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
      }

      .color-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: 0 0 7px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .color-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 58px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        transition: border-color 0.12s;
      }

      .color-field:focus-within {
        border-color: var(--accent);
      }

      .hex-field {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        padding-left: 6px;
        min-width: 0;
      }

      input[type="color"] {
        width: 18px;
        height: 18px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
        transition: border-color 0.12s;
      }

      input[type="color"]:hover { border-color: rgba(255, 255, 255, 0.3); }

      input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 2px; }

      .hex-input {
        width: 100%;
        padding: 0 6px !important;
        border-left: 0 !important;
        text-transform: uppercase;
        text-align: left !important;
        letter-spacing: 0.04em !important;
        font-size: 11px;
      }

      .alpha-field {
        position: relative;
        border-left: 1px solid var(--border);
        background: var(--surface2);
      }

      .alpha-field input {
        width: 100%;
        padding: 0 18px 0 8px;
        border-left: 0;
        background: transparent;
        text-align: left !important;
      }

      .alpha-field span {
        position: absolute;
        top: 50%;
        right: 7px;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 10px;
        pointer-events: none;
      }

      /* ── Footer ─────────────────────────────────────────────────── */
      .footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
      }

      .status-wrap { min-width: 0; }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        flex: 0 0 6px;
        transition: background 0.2s;
      }

      .status-dot.busy  { background: var(--accent); }
      .status-dot.error { background: var(--error); }

      .status {
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--text);
      }

      .status.error { color: var(--error); }

      .status-detail {
        display: none;
        margin-top: 1px;
        padding-left: 12px;
        color: var(--text3);
        font-size: 10px;
        line-height: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-detail.visible { display: block; }

      /* ── Generate button ────────────────────────────────────────── */
      .primary-button {
        min-width: 84px;
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.12s, background 0.12s;
      }

      .primary-button:hover:not(:disabled) {
        background: #1aa3ff;
      }

      .primary-button:active:not(:disabled) {
        opacity: 0.85;
      }

      .primary-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .primary-button:disabled {
        background: var(--surface2);
        color: var(--text3);
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">

      <!-- Titlebar -->
      <header class="titlebar">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5" stroke-width="1.7"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5" stroke-width="1.7"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5" stroke-width="1.7"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5" stroke-width="1.7"/>
          </svg>
        </div>

        <div class="title-group">
          <h1>Block Mosaic</h1>
        </div>

        <div class="titlebar-actions">
          <button class="icon-button" id="randomize" type="button" title="Randomize pattern" aria-label="Randomize pattern">
            <svg viewBox="0 0 24 24">
              <path d="m14.5 5.5 4 4M4 20l2.1-5.3L16.7 4.1a1.4 1.4 0 0 1 2 0l1.2 1.2a1.4 1.4 0 0 1 0 2L9.3 17.9 4 20Z"/>
              <path d="M6 3v4M4 5h4m11 10v5m-2.5-2.5h5"/>
            </svg>
          </button>

          <button class="icon-button" id="close" type="button" title="Close plugin" aria-label="Close plugin">
            <svg viewBox="0 0 24 24">
              <path d="m5 5 14 14M19 5 5 19"/>
            </svg>
          </button>
        </div>
      </header>

      <main>
        <!-- Grid section -->
        <section class="section" aria-labelledby="gridTitle">
          <div class="section-header">
            <h2 class="section-title" id="gridTitle">Grid</h2>
          </div>

          <div class="parameter-row">
            <label class="row-label" for="cellSizeRange">Cell size</label>
            <div class="compound-field">
              <div class="range-wrap">
                <input id="cellSizeRange" type="range" min="8" max="80" step="1" value="24" />
              </div>
              <input id="cellSize" type="number" min="8" max="80" step="1" value="24" aria-label="Cell size value" />
            </div>
          </div>

          <div class="parameter-row">
            <label class="row-label" for="densityRange">Fill density</label>
            <div class="compound-field">
              <div class="range-wrap">
                <input id="densityRange" type="range" min="0.02" max="0.8" step="0.01" value="0.2" />
              </div>
              <input id="density" type="number" min="0.02" max="0.8" step="0.01" value="0.2" aria-label="Fill density value" />
            </div>
          </div>

          <div class="parameter-row">
            <label class="row-label" for="accentRatioRange">Accent ratio</label>
            <div class="compound-field">
              <div class="range-wrap">
                <input id="accentRatioRange" type="range" min="0" max="1" step="0.01" value="0.2" />
              </div>
              <input id="accentRatio" type="number" min="0" max="1" step="0.01" value="0.2" aria-label="Accent ratio value" />
            </div>
          </div>

          <div class="parameter-row">
            <label class="row-label" for="seedRange">Seed</label>
            <div class="compound-field">
              <div class="range-wrap">
                <input id="seedRange" type="range" min="0" max="999" step="1" value="42" />
              </div>
              <input id="seed" type="number" min="0" max="999" step="1" value="42" aria-label="Seed value" />
            </div>
          </div>
        </section>

        <!-- Colors section -->
        <section class="section" aria-labelledby="colorsTitle">
          <div class="section-header">
            <h2 class="section-title" id="colorsTitle">Colors</h2>
          </div>

          <div class="color-row" data-color="bgColor">
            <label class="row-label" for="bgColorHex">
              <span class="color-dot" style="background:#ffffff;"></span>Background
            </label>
            <div class="color-field">
              <div class="hex-field">
                <input id="bgColorPicker" type="color" value="#ffffff" aria-label="Background color picker" />
                <input class="hex-input" id="bgColorHex" type="text" value="FFFFFF" maxlength="6" spellcheck="false" aria-label="Background hex color" />
              </div>
              <div class="alpha-field">
                <input id="bgColorAlpha" type="number" min="0" max="100" step="1" value="100" aria-label="Background opacity" />
                <span>%</span>
              </div>
            </div>
          </div>

          <div class="color-row" data-color="neutralColor">
            <label class="row-label" for="neutralColorHex">
              <span class="color-dot" style="background:#d0d0d0;"></span>Neutral
            </label>
            <div class="color-field">
              <div class="hex-field">
                <input id="neutralColorPicker" type="color" value="#d0d0d0" aria-label="Neutral color picker" />
                <input class="hex-input" id="neutralColorHex" type="text" value="D0D0D0" maxlength="6" spellcheck="false" aria-label="Neutral hex color" />
              </div>
              <div class="alpha-field">
                <input id="neutralColorAlpha" type="number" min="0" max="100" step="1" value="100" aria-label="Neutral opacity" />
                <span>%</span>
              </div>
            </div>
          </div>

          <div class="color-row" data-color="accentColor">
            <label class="row-label" for="accentColorHex">
              <span class="color-dot" style="background:#e03030;"></span>Accent
            </label>
            <div class="color-field">
              <div class="hex-field">
                <input id="accentColorPicker" type="color" value="#e03030" aria-label="Accent color picker" />
                <input class="hex-input" id="accentColorHex" type="text" value="E03030" maxlength="6" spellcheck="false" aria-label="Accent hex color" />
              </div>
              <div class="alpha-field">
                <input id="accentColorAlpha" type="number" min="0" max="100" step="1" value="100" aria-label="Accent opacity" />
                <span>%</span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="status-wrap">
          <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <p class="status" id="status">Ready</p>
          </div>
          <p class="status-detail" id="statusDetail"></p>
        </div>
        <button class="primary-button" id="generate" type="button">Generate</button>
      </footer>
    </div>

    <script>
      /* Slider fill ------------------------------------------------ */
      function updateSliderFill(input) {
        var min = parseFloat(input.min) || 0;
        var max = parseFloat(input.max) || 100;
        var val = parseFloat(input.value) || 0;
        var pct = ((val - min) / (max - min)) * 100;
        input.style.setProperty("--pct", pct.toFixed(1));
      }

      document.querySelectorAll("input[type=range]").forEach(function(r) {
        updateSliderFill(r);
        r.addEventListener("input", function() { updateSliderFill(r); });
      });

      /* Controls -------------------------------------------------- */
      const numericControls = {
        cellSize:    { range: document.getElementById("cellSizeRange"),    number: document.getElementById("cellSize"),    min: 8,    max: 80,  fallback: 24,  integer: true  },
        density:     { range: document.getElementById("densityRange"),     number: document.getElementById("density"),     min: 0.02, max: 0.8, fallback: 0.2, integer: false },
        accentRatio: { range: document.getElementById("accentRatioRange"), number: document.getElementById("accentRatio"), min: 0,    max: 1,   fallback: 0.2, integer: false },
        seed:        { range: document.getElementById("seedRange"),        number: document.getElementById("seed"),        min: 0,    max: 999, fallback: 42,  integer: true  },
      };

      const colorControls = {
        bgColor:      { picker: document.getElementById("bgColorPicker"),      hex: document.getElementById("bgColorHex"),      alpha: document.getElementById("bgColorAlpha"),      fallback: "FFFFFF" },
        neutralColor: { picker: document.getElementById("neutralColorPicker"), hex: document.getElementById("neutralColorHex"), alpha: document.getElementById("neutralColorAlpha"), fallback: "D0D0D0" },
        accentColor:  { picker: document.getElementById("accentColorPicker"),  hex: document.getElementById("accentColorHex"),  alpha: document.getElementById("accentColorAlpha"),  fallback: "E03030" },
      };

      const generateButton = document.getElementById("generate");
      const status         = document.getElementById("status");
      const statusDetail   = document.getElementById("statusDetail");
      const statusDot      = document.getElementById("statusDot");
      let canLiveUpdate    = false;
      let liveTimer        = 0;

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function normalizeNumber(control, rawValue) {
        const parsed  = Number(rawValue);
        const finite  = Number.isFinite(parsed) ? parsed : control.fallback;
        const clamped = clamp(finite, control.min, control.max);
        return control.integer ? Math.round(clamped) : clamped;
      }

      function normalizeHex(value, fallback) {
        const filtered = String(value || "").replace(/[^0-9a-f]/gi, "").slice(0, 6).toUpperCase();
        return /^[0-9A-F]{6}$/.test(filtered) ? filtered : fallback;
      }

      function colorFromControls(control) {
        const hex     = normalizeHex(control.hex.value, control.fallback);
        const alpha   = clamp(Number(control.alpha.value) || 0, 0, 100) / 100;
        const channel = function(offset) { return Number.parseInt(hex.slice(offset, offset + 2), 16) / 255; };
        return { r: channel(0), g: channel(2), b: channel(4), a: alpha };
      }

      function colorToHex(color, fallback) {
        if (!color || typeof color !== "object") return fallback;
        const channel = function(value) {
          return Math.round(clamp(Number(value) || 0, 0, 1) * 255).toString(16).padStart(2, "0").toUpperCase();
        };
        return channel(color.r) + channel(color.g) + channel(color.b);
      }

      function currentParams() {
        return {
          cellSize:     normalizeNumber(numericControls.cellSize,    numericControls.cellSize.number.value),
          density:      normalizeNumber(numericControls.density,     numericControls.density.number.value),
          accentRatio:  normalizeNumber(numericControls.accentRatio, numericControls.accentRatio.number.value),
          seed:         normalizeNumber(numericControls.seed,        numericControls.seed.number.value),
          bgColor:      colorFromControls(colorControls.bgColor),
          neutralColor: colorFromControls(colorControls.neutralColor),
          accentColor:  colorFromControls(colorControls.accentColor),
        };
      }

      function setStatus(label, detail, isError) {
        detail  = detail  || "";
        isError = isError || false;
        status.textContent = label;
        status.classList.toggle("error", isError);
        statusDetail.textContent = detail;
        statusDetail.classList.toggle("visible", Boolean(detail));
        statusDot.classList.remove("busy", "error");
        if (isError) statusDot.classList.add("error");
        else if (label === "Updating\u2026" || label === "Generating\u2026") statusDot.classList.add("busy");
      }

      function scheduleLiveUpdate() {
        window.clearTimeout(liveTimer);
        if (!canLiveUpdate) { setStatus("Ready"); return; }
        setStatus("Updating\u2026");
        liveTimer = window.setTimeout(function() {
          parent.postMessage({ pluginMessage: { type: "live-update", params: currentParams() } }, "*");
        }, 90);
      }

      for (const control of Object.values(numericControls)) {
        control.range.addEventListener("input", function() {
          control.number.value = control.range.value;
          scheduleLiveUpdate();
        });
        control.number.addEventListener("input", function() {
          const parsed = Number(control.number.value);
          if (Number.isFinite(parsed)) control.range.value = String(clamp(parsed, control.min, control.max));
          updateSliderFill(control.range);
          scheduleLiveUpdate();
        });
        control.number.addEventListener("change", function() {
          const normalized     = normalizeNumber(control, control.number.value);
          control.number.value = String(normalized);
          control.range.value  = String(normalized);
          updateSliderFill(control.range);
          scheduleLiveUpdate();
        });
      }

      for (const control of Object.values(colorControls)) {
        control.picker.addEventListener("input", function() {
          control.hex.value = control.picker.value.slice(1).toUpperCase();
          scheduleLiveUpdate();
        });
        control.hex.addEventListener("input", function() {
          control.hex.value = control.hex.value.replace(/[^0-9a-f]/gi, "").slice(0, 6).toUpperCase();
          if (/^[0-9A-F]{6}$/.test(control.hex.value)) {
            control.picker.value = "#" + control.hex.value.toLowerCase();
            scheduleLiveUpdate();
          }
        });
        control.hex.addEventListener("change", function() {
          control.hex.value    = normalizeHex(control.hex.value, control.fallback);
          control.picker.value = "#" + control.hex.value.toLowerCase();
          scheduleLiveUpdate();
        });
        control.alpha.addEventListener("input", scheduleLiveUpdate);
        control.alpha.addEventListener("change", function() {
          control.alpha.value = String(Math.round(clamp(Number(control.alpha.value) || 0, 0, 100)));
          scheduleLiveUpdate();
        });
      }

      function setPanelParams(params) {
        if (!params || typeof params !== "object") return;
        for (const [key, control] of Object.entries(numericControls)) {
          if (params[key] === undefined) continue;
          const normalized     = normalizeNumber(control, params[key]);
          control.range.value  = String(normalized);
          control.number.value = String(normalized);
          updateSliderFill(control.range);
        }
        for (const [key, control] of Object.entries(colorControls)) {
          const color = params[key];
          if (!color) continue;
          const hex            = colorToHex(color, control.fallback);
          control.hex.value    = hex;
          control.picker.value = "#" + hex.toLowerCase();
          control.alpha.value  = String(Math.round(clamp(Number(color.a != null ? color.a : 1), 0, 1) * 100));
        }
      }

      document.getElementById("randomize").addEventListener("click", function() {
        const randomValues = new Uint32Array(1);
        crypto.getRandomValues(randomValues);
        const nextSeed = randomValues[0] % 1000;
        numericControls.seed.range.value  = String(nextSeed);
        numericControls.seed.number.value = String(nextSeed);
        updateSliderFill(numericControls.seed.range);
        scheduleLiveUpdate();
      });

      document.getElementById("close").addEventListener("click", function() {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      });

      generateButton.addEventListener("click", function() {
        window.clearTimeout(liveTimer);
        generateButton.disabled = true;
        setStatus("Generating\u2026");
        parent.postMessage({ pluginMessage: { type: "generate", params: currentParams() } }, "*");
      });

      window.addEventListener("message", function(event) {
        const message = event.data && event.data.pluginMessage;
        if (!message) return;

        if (message.type === "params-change") {
          setPanelParams(message.params);
          return;
        }

        if (message.type === "action-state") {
          canLiveUpdate           = Boolean(message.canLiveUpdate);
          generateButton.disabled = Boolean(message.busy);
          generateButton.textContent = message.busy ? "Working\u2026" : (message.buttonLabel || "Generate");
          setStatus(message.busy ? "Updating\u2026" : message.status, message.busy ? "" : message.detail);
          return;
        }

        if (message.type === "generation-complete") {
          statusDot.classList.remove("busy", "error");
          setStatus(message.live ? "Live" : "Ready", message.blockCount + " blocks");
          return;
        }

        if (message.type === "plugin-error") {
          setStatus("Could not generate", message.message || "Unknown error", true);
        }
      });

      function reportHeight() {
        const height = Math.ceil(document.getElementById("app").getBoundingClientRect().height);
        parent.postMessage({ pluginMessage: { type: "resize", height: height } }, "*");
      }

      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(reportHeight).observe(document.getElementById("app"));
      }
      requestAnimationFrame(reportHeight);
    </script>
  </body>
</html>
